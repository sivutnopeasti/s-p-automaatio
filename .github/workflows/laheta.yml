name: Lähetä sähköpostit

on:
  schedule:
    # GitHub jättää ajastettuja ajoja usein väliin, joten yritetään joka tunti
    # ma-pe klo 9-17 (talviaika) Suomen aikaa. Skripti lähettää vain päivän määrän
    # verran: kun määrä on täynnä, myöhemmät ajot eivät lähetä mitään.
    - cron: "23 7-15 * * 1-5"
  workflow_dispatch:
    inputs:
      kuivaharjoitus:
        description: "Kuivaharjoitus (ei lähetä mitään, vain tulostaa)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: laheta
  cancel-in-progress: false

jobs:
  laheta:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # Haetaan mainin TUOREIN versio (ei käynnistyshetken versiota), jotta
      # edellisen ajon lähetykset näkyvät eikä kenellekään lähetetä kahdesti.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lähetä
        env:
          SMTP_SALASANA: ${{ secrets.salasana }}
          SMTP_SALASANA_VISIOREACH: ${{ secrets.salasana_visioreach }}
          SMTP_SALASANA_VISIOSITES: ${{ secrets.salasana_visiosites }}
          KUIVAHARJOITUS: ${{ github.event_name == 'workflow_dispatch' && inputs.kuivaharjoitus || 'false' }}
          AJO: ${{ github.event_name }}
        run: python laheta.py
      - name: Tallenna lähetetyt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp lahetetyt.csv "$RUNNER_TEMP/lahetetyt.csv"; cp estetyt.csv "$RUNNER_TEMP/estetyt.csv"
          for yritys in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            # Lisätään tämän ajon uudet rivit mainin uusimpaan versioon (ei ristiriitoja)
            for f in lahetetyt.csv estetyt.csv; do
              python - "$f" "$RUNNER_TEMP/$f" <<'PY'
          import sys
          kohde, oma = sys.argv[1], sys.argv[2]
          vanhat = open(kohde, encoding="utf-8").read().splitlines()
          olemassa = set(vanhat)
          uudet = [r for r in open(oma, encoding="utf-8").read().splitlines() if r and r not in olemassa]
          if uudet:
              with open(kohde, "a", encoding="utf-8") as f:
                  f.write("".join(r + "\n" for r in uudet))
          PY
            done
            git add lahetetyt.csv estetyt.csv
            git diff --cached --quiet && exit 0
            git commit -qm "Päivitä lähetetyt"
            git push -q origin HEAD:main && exit 0
            sleep $((yritys * 5))
          done
          echo "::error::Lähetettyjen tallennus epäonnistui"; exit 1
