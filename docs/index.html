<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Säpöautomaatio</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --accent:#2563eb; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111318; --card:#1b1e25; --text:#e7e9ee; --muted:#9aa1ad; --accent:#60a5fa; --border:#2b2f38; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:480px; margin:40px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; margin-bottom:16px; }
  h1 { font-size:20px; margin:0 0 16px; }
  .big { font-size:48px; font-weight:700; text-align:center; margin:8px 0; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  input[type=email], input[type=text], select, textarea { width:100%; padding:8px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; margin-top:8px; }
  textarea { min-height:160px; resize:vertical; }
  input[type=password] { width:100%; padding:8px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 16px; font-size:16px; cursor:pointer; width:100%; margin-top:12px; }
  label { display:flex; gap:8px; align-items:center; margin-top:12px; }
  .muted { color:var(--muted); font-size:14px; }
  .stats { display:flex; justify-content:space-between; text-align:center; }
  [hidden] { display:none !important; }
  .esik { max-width:720px; margin:0 auto 40px; padding:0 16px; }
  .esik iframe { width:100%; height:1000px; border:1px solid var(--border); border-radius:8px; background:#fff; display:block; }
  .esik pre { max-height:600px; overflow:auto; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px; font-size:12px; white-space:pre-wrap; word-break:break-all; }
  .rivi { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .rivi input { flex:1; min-width:140px; margin:0; }
  .rivi button { width:auto; margin:0; }
  .stats b { display:block; font-size:22px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Sähköposteja päivässä</h1>
    <div class="big" id="arvo">–</div>
    <input type="range" id="liuku" min="0" max="200" step="1" value="20">
    <label><input type="checkbox" id="kaytossa"> Lähetys käytössä</label>
    <button id="tallenna">Tallenna</button>
    <p class="muted" id="tila"></p>
  </div>
  <div class="card stats">
    <div><b id="s-tanaan">–</b><span class="muted">tänään</span></div>
    <div><b id="s-yht">–</b><span class="muted">lähetetty</span></div>
    <div><b id="s-jono">–</b><span class="muted">jäljellä</span></div>
  </div>
  <div class="card">
    <h1>Lähetä yksi viesti</h1>
    <input type="email" id="m-to" placeholder="vastaanottaja@esimerkki.fi">
    <input type="text" id="m-aihe" placeholder="Aihe">
    <textarea id="m-viesti" placeholder="Kirjoita viesti tähän"></textarea>
    <select id="m-from"><option>ugc@visioreach.fi</option><option>ugc@visiosites.fi</option></select>
    <button id="m-laheta">Lähetä</button>
    <p class="muted" id="m-tila"></p>
  </div>
  <div class="card">
    <p class="muted">GitHub-token (fine-grained, oikeudet <i>Contents</i> ja <i>Actions: Read and write</i> tähän repoon). Tallentuu vain tähän selaimeen.</p>
    <input type="password" id="token" placeholder="github_pat_...">
  </div>
</main>
<section class="esik">
  <div class="card">
    <h1>Viestin esikatselu</h1>
    <p class="muted" id="e-aihe"></p>
    <div class="rivi">
      <input type="text" id="e-nimi" placeholder="Esimerkkinimi, esim. Matti (tyhjä = ei nimeä)">
      <button id="e-koodi" type="button">Näytä HTML-koodi</button>
    </div>
    <p></p>
    <iframe id="e-frame" title="Viestin esikatselu" sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe>
    <pre id="e-pre" hidden></pre>
  </div>
</section>
<script>
const REPO = "sivutnopeasti/s-p-automaatio";
const API = `https://api.github.com/repos/${REPO}/contents/`;
const $ = id => document.getElementById(id);
let sha = null, config = {};

const getToken = () => { try { return localStorage.getItem("gh_token") || ""; } catch { return ""; } };
$("token").value = getToken();
$("token").addEventListener("change", e => { try { localStorage.setItem("gh_token", e.target.value.trim()); } catch {} lataa(); });
$("liuku").addEventListener("input", e => $("arvo").textContent = e.target.value);

const otsikot = () => ({ Authorization: `Bearer ${getToken()}`, Accept: "application/vnd.github+json" });
const dekoodaa = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, "")), c => c.charCodeAt(0)));
const enkoodaa = txt => btoa(String.fromCharCode(...new TextEncoder().encode(txt)));
const rivit = txt => txt.trim().split(/\r?\n/).slice(1).filter(Boolean);

async function hae(polku) {
  const r = await fetch(API + polku + "?t=" + Date.now(), { headers: otsikot() });
  if (!r.ok) throw new Error(`${polku}: ${r.status}`);
  return r.json();
}

async function lataa() {
  if (!getToken()) { $("tila").textContent = "Syötä GitHub-token alle."; return; }
  try {
    const c = await hae("config.json");
    sha = c.sha; config = JSON.parse(dekoodaa(c.content));
    $("liuku").value = config.paivittainen_maara; $("arvo").textContent = config.paivittainen_maara;
    $("kaytossa").checked = !!config.kaytossa;
    $("tila").textContent = "Ladattu.";
    const [l, s, e] = await Promise.all(["lista.csv", "lahetetyt.csv", "estetyt.csv"].map(p => hae(p).then(x => dekoodaa(x.content)).catch(() => "x\n")));
    const lahetetyt = rivit(s).map(r => r.split(","));
    const pois = new Set([...lahetetyt.map(r => r[1].toLowerCase()), ...rivit(e).map(r => r.toLowerCase())]);
    const tanaan = new Date().toISOString().slice(0, 10);
    $("s-tanaan").textContent = lahetetyt.filter(r => r[0].startsWith(tanaan)).length;
    $("s-yht").textContent = lahetetyt.length;
    $("s-jono").textContent = new Set(rivit(l).map(r => r.split(",")[0].trim().toLowerCase()).filter(x => x.includes("@") && !pois.has(x))).size;
  } catch (err) { $("tila").textContent = "Virhe: " + err.message; }
}

$("tallenna").addEventListener("click", async () => {
  config.paivittainen_maara = Number($("liuku").value);
  config.kaytossa = $("kaytossa").checked;
  $("tila").textContent = "Tallennetaan…";
  const r = await fetch(API + "config.json", {
    method: "PUT", headers: otsikot(),
    body: JSON.stringify({ message: `Päivittäinen määrä ${config.paivittainen_maara}${config.kaytossa ? "" : " (pois käytöstä)"}`, content: enkoodaa(JSON.stringify(config, null, 2) + "\n"), sha })
  });
  if (r.ok) { sha = (await r.json()).content.sha; $("tila").textContent = "Tallennettu ✓"; }
  else $("tila").textContent = "Tallennus epäonnistui: " + r.status;
});

$("m-laheta").addEventListener("click", async () => {
  const to = $("m-to").value.trim(), aihe = $("m-aihe").value.trim(), viesti = $("m-viesti").value;
  if (!/^[^\s@,]+@[^\s@,]+\.[^\s@,]+$/.test(to)) { $("m-tila").textContent = "Tarkista vastaanottajan osoite."; return; }
  if (!aihe || !viesti.trim()) { $("m-tila").textContent = "Aihe ja viesti ovat pakollisia."; return; }
  if (!confirm(`Lähetetäänkö viesti osoitteeseen ${to}?`)) return;
  $("m-laheta").disabled = true; $("m-tila").textContent = "Lähetetään…";
  const r = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/laheta-yksi.yml/dispatches`, {
    method: "POST", headers: otsikot(),
    body: JSON.stringify({ ref: "main", inputs: { vastaanottaja: to, aihe, viesti, lahettaja: $("m-from").value } })
  });
  $("m-laheta").disabled = false;
  if (r.status === 204) {
    $("m-tila").innerHTML = `Lähetys käynnistetty ✓ Viesti lähtee noin minuutin kuluessa. <a href="https://github.com/${REPO}/actions/workflows/laheta-yksi.yml" target="_blank">Seuraa tästä</a>`;
    $("m-viesti").value = "";
  } else $("m-tila").textContent = "Lähetys epäonnistui: " + r.status + " (onko tokenilla Actions-oikeus?)";
});

let htmlPohja = "", tekstiPohja = "";
const tayta = (t, nimi) => t.replaceAll("{nimi}", nimi).replaceAll(" ,", ",");
function nayta() {
  const nimi = $("e-nimi").value.trim();
  $("e-frame").srcdoc = tayta(htmlPohja, nimi);
  $("e-pre").textContent = htmlPohja;
  const aihe = (tekstiPohja.split(/\r?\n/)[0] || "").replace(/^aihe:\s*/i, "");
  $("e-aihe").textContent = aihe ? "Aihe: " + tayta(aihe, nimi) : "";
}
async function lataaEsikatselu() {
  if (!getToken()) return;
  try {
    const [h, t] = await Promise.all(["viesti.html", "viesti.txt"].map(p => hae(p).then(x => dekoodaa(x.content))));
    htmlPohja = h; tekstiPohja = t; nayta();
  } catch (err) { $("e-aihe").textContent = "Esikatselun lataus epäonnistui: " + err.message; }
}
$("e-nimi").addEventListener("input", nayta);
$("e-koodi").addEventListener("click", () => {
  const piilossa = $("e-pre").hidden;
  $("e-pre").hidden = !piilossa; $("e-frame").hidden = piilossa;
  $("e-koodi").textContent = piilossa ? "Näytä esikatselu" : "Näytä HTML-koodi";
});
$("token").addEventListener("change", lataaEsikatselu);

lataa();
lataaEsikatselu();
</script>
</body>
</html>
